version: "2"

run:
  timeout: 5m

linters:
  enable:
    - misspell
    - unconvert
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Generated deepcopy code follows controller-gen conventions.
      - path: zz_generated\.deepcopy\.go
        linters: [staticcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/maarlab-rethinking/hcloud-egress-gateway-controller
