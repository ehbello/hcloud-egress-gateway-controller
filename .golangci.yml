run:
  timeout: 5m

linters-settings:
  goimports:
    local-prefixes: github.com/maarlab-rethinking/hcloud-egress-gateway-controller

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert

issues:
  exclude-rules:
    # Generated deepcopy code follows controller-gen conventions.
    - path: zz_generated\.deepcopy\.go
      linters: [staticcheck]
