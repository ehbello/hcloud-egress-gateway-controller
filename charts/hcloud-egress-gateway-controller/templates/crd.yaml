{{- if .Values.installCRD }}
# Hand-maintained here for chart installability; keep in sync with api/v1alpha1
# (canonically generated by `controller-gen crd`).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hetzneregressgateways.egress.maarlab.dev
spec:
  group: egress.maarlab.dev
  scope: Cluster
  names:
    kind: HetznerEgressGateway
    listKind: HetznerEgressGatewayList
    plural: hetzneregressgateways
    singular: hetzneregressgateway
    shortNames: [heg]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.readyGateways
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [podSelector]
              properties:
                floatingIPs:
                  type: array
                  items: { type: string }
                managed:
                  type: object
                  required: [count, homeLocation]
                  properties:
                    count: { type: integer, minimum: 1 }
                    homeLocation: { type: string, minLength: 1 }
                    type: { type: string, enum: [ipv4, ipv6], default: ipv4 }
                    reclaimPolicy: { type: string, enum: [Retain, Delete], default: Retain }
                    labels:
                      type: object
                      additionalProperties: { type: string }
                podSelector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                destinationCIDRs:
                  type: array
                  items: { type: string }
                excludedCIDRs:
                  type: array
                  items: { type: string }
                egressInterface: { type: string, default: egr0 }
                backend: { type: string, enum: [cilium, host-routing], default: cilium }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
{{- end }}
