apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["controller", "--agent-image=$(AGENT_IMAGE)", "--leader-elect"]
          env:
            - name: AGENT_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            - name: AGENT_SERVICE_ACCOUNT
              value: {{ .Release.Name }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HCLOUD_TOKEN_SECRET_NAME
              value: {{ .Values.hcloud.tokenSecretName }}
            - name: HCLOUD_TOKEN_SECRET_KEY
              value: {{ .Values.hcloud.tokenSecretKey }}
            - name: HCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hcloud.tokenSecretName }}
                  key: {{ .Values.hcloud.tokenSecretKey }}
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
